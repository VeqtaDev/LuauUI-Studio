<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>LuauUI Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --ink: linear-gradient(180deg,#ffffff 0%,#9a9a9a 100%);
  --ink2: linear-gradient(180deg,#d6d6d6 0%,#7a7a7a 100%);
  --disc: linear-gradient(180deg,#3b3b3b 0%,#121212 100%);
  --disc-on: linear-gradient(180deg,#ffffff 0%,#9c9c9c 100%);
  --pill: linear-gradient(180deg,#262626 0%,#0c0c0c 100%);
  --panel: linear-gradient(180deg,#232323 0%,#0a0a0a 100%);
  --spring: cubic-bezier(.34,1.56,.64,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#eee;font-family:Inter,"SF Pro Display","Segoe UI Variable Display","Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
button{font-family:inherit}
.gt{background:var(--ink);-webkit-background-clip:text;background-clip:text;color:transparent}
.gt2{background:var(--ink2);-webkit-background-clip:text;background-clip:text;color:transparent}
.gtd{background:linear-gradient(180deg,#2c2c2c,#000);-webkit-background-clip:text;background-clip:text;color:transparent}

#app{position:fixed;inset:0;display:grid;grid-template-rows:44px 84px minmax(0,1fr) 92px;grid-template-columns:minmax(0,1fr) 400px;
  background:radial-gradient(1400px 800px at 28% 18%,#2b2b2b 0%,#0d0d0d 55%,#000 100%)}
#app::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:24px 24px}

/* title bar */
#titlebar{grid-column:1/3;display:flex;align-items:center;gap:16px;padding:0 18px;position:relative;z-index:5;
  background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0));border-bottom:1px solid rgba(255,255,255,.06)}
.lights{display:flex;gap:8px}
.light{width:13px;height:13px;border-radius:7px;border:0;padding:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform .3s var(--spring)}
.light svg{opacity:0;transition:opacity .2s}
.lights:hover .light svg{opacity:1}
.light:hover{transform:scale(1.18)}
.l1{background:linear-gradient(180deg,#fff,#8a8a8a)}
.l2{background:linear-gradient(180deg,#9a9a9a,#3a3a3a)}
.l3{background:linear-gradient(180deg,#4a4a4a,#111)}
#title{flex:1;text-align:center;font-size:13px;font-weight:650}
.meta{font-size:12px;font-weight:600}
.langbtn{border:0;cursor:pointer;height:26px;min-width:40px;padding:0 10px;border-radius:13px;font-size:11px;font-weight:800;letter-spacing:.04em;color:#0a0a0a;
  background:linear-gradient(180deg,#fff,#9c9c9c);box-shadow:0 4px 12px rgba(0,0,0,.5);transition:transform .35s var(--spring)}
.langbtn:hover{transform:scale(1.08)}
.langbtn:active{transform:scale(.92)}

/* round icon buttons */
.ib{border:0;padding:0;cursor:pointer;background:transparent;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:52px}
.ib .disc{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:var(--disc);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(0,0,0,.6),0 6px 18px rgba(0,0,0,.55);transition:transform .4s var(--spring),box-shadow .3s}
.ib svg{transition:transform .5s var(--spring)}
.ib:hover .disc{transform:translateY(-2px);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 26px rgba(0,0,0,.7)}
.ib:hover svg{transform:scale(1.15) rotate(-7deg)}
.ib:active .disc{transform:scale(.88)}
.ib.on .disc{background:var(--disc-on)}
.ib .lbl{font-size:11px;font-weight:650;background:var(--ink2);-webkit-background-clip:text;background-clip:text;color:transparent;white-space:nowrap}
.ib.on .lbl{background:var(--ink);-webkit-background-clip:text;background-clip:text}
.pill{background:var(--pill);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 10px 30px rgba(0,0,0,.6);border-radius:999px}
.group{display:flex;gap:14px;padding:8px 18px 6px}

#toolbar{grid-column:1/3;position:relative;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.tleft,.tright{display:flex;align-items:flex-start;gap:14px;min-width:280px}
.tright{justify-content:flex-end}
.projname{display:flex;align-items:center;gap:10px;height:44px;border:0;background:transparent;cursor:pointer;padding:0}
.projname .t{font-size:19px;font-weight:800;letter-spacing:-.02em}
.chev{width:28px;height:28px;border-radius:14px;display:flex;align-items:center;justify-content:center;transition:transform .4s var(--spring)}
.projname:hover .chev{transform:rotate(180deg)}

/* stage */
#stage{grid-row:3;grid-column:1;position:relative;padding:8px 24px 12px 32px;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:0}
#frame{position:relative;flex:1;min-height:0;border-radius:24px;padding:1.5px;
  background:linear-gradient(120deg,#fff,#3a3a3a 20%,#0a0a0a 45%,#8a8a8a 70%,#fff);background-size:300% 300%;animation:flow 9s linear infinite}
@keyframes flow{0%{background-position:0% 50%}100%{background-position:300% 50%}}
#frameIn{position:absolute;inset:1.5px;border-radius:22.5px;overflow:hidden;background:radial-gradient(900px 520px at 50% 0%,#353535 0%,#141414 55%,#050505 100%);display:flex;align-items:center;justify-content:center}
#screenWrap{position:absolute;left:0;top:0;transform-origin:0 0}
#screen{position:relative;overflow:hidden;background:linear-gradient(180deg,#4a4a4a 0%,#262626 45%,#101010 100%);box-shadow:0 30px 90px rgba(0,0,0,.6)}
#screen::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(60% 60% at 50% 40%,rgba(255,255,255,.08),rgba(255,255,255,0))}
#gridOv{position:absolute;inset:0;pointer-events:none;z-index:9000;display:none;
  background-image:linear-gradient(rgba(255,255,255,.10) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.10) 1px,transparent 1px);background-size:40px 40px}
#topbar{position:absolute;left:0;right:0;top:0;height:58px;z-index:8000;pointer-events:none;display:flex;align-items:center;gap:12px;padding:0 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,0));border-bottom:1px dashed rgba(255,255,255,.25)}
#topbar span{height:44px;border-radius:22px;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,.12))}
#devlabel{position:absolute;left:16px;bottom:12px;font-size:11px;font-weight:650;z-index:3}
.layer{position:absolute;left:0;right:0;bottom:0;top:0}
.layer.pop{animation:pop .55s var(--spring) both}
@keyframes pop{0%{opacity:0;transform:scale(.9) translateY(14px);filter:blur(8px)}100%{opacity:1;transform:none;filter:none}}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;z-index:1;text-align:center;padding:24px}
.empty .a{font-size:22px;font-weight:800}
.empty .b{font-size:13px;font-weight:550}

/* rendered Roblox objects */
.rbx{box-sizing:border-box}
.rbx-c{box-sizing:border-box}
.rbx-t{position:absolute;inset:0;display:flex;pointer-events:none}
.rbx-t > span{display:block;max-width:100%}
.rbx-btn{cursor:pointer}
.rbx-btn.auto:hover{filter:brightness(.88)}
.rbx-btn.auto:active{filter:brightness(.72)}
.rbx input,.rbx textarea{all:unset;width:100%;height:100%;pointer-events:auto;user-select:text;cursor:text}
.rbx-img{position:absolute;inset:0;border-radius:inherit;overflow:hidden;pointer-events:none}
.rbx-img img{width:100%;height:100%;display:block}
.rbx-ph{position:absolute;inset:0;border-radius:inherit;display:flex;align-items:center;justify-content:center;font:600 10px/1.2 "JetBrains Mono",monospace;color:rgba(255,255,255,.6);
  background:repeating-linear-gradient(45deg,rgba(255,255,255,.10) 0 8px,rgba(255,255,255,.03) 8px 16px)}
.inspect .rbx{cursor:crosshair!important}
#hl{position:absolute;pointer-events:none;z-index:9500;border:1.5px dashed rgba(255,255,255,.95);border-radius:4px;display:none;box-shadow:0 0 0 9999px rgba(0,0,0,.18)}
#hl .tag{position:absolute;left:-1px;top:-26px;white-space:nowrap;font:700 11px/1 Inter,sans-serif;padding:6px 8px;border-radius:8px;background:var(--disc-on);color:#0a0a0a}
#hl.flash{animation:flash .9s ease-out}
@keyframes flash{0%{box-shadow:0 0 0 9999px rgba(0,0,0,.45)}100%{box-shadow:0 0 0 9999px rgba(0,0,0,.18)}}

/* error card */
#errors{position:absolute;left:16px;right:16px;bottom:16px;z-index:9600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.errcard{pointer-events:auto;border-radius:16px;padding:12px 14px;background:linear-gradient(180deg,#ffffff,#a9a9a9);color:#0a0a0a;box-shadow:0 18px 50px rgba(0,0,0,.6);animation:pop .5s var(--spring) both;max-height:180px;overflow:auto}
.errcard b{font-size:13px;font-weight:800}
.errcard pre{margin:6px 0 0;font:500 12px/1.5 "JetBrains Mono",Consolas,monospace;white-space:pre-wrap;user-select:text}

/* hot reload strip */
#reloadRow{display:flex;align-items:center;gap:14px}
#reloadPill{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;white-space:nowrap}
.pulse{position:relative;width:10px;height:10px;border-radius:5px;background:var(--ink);flex:none}
.pulse::after{content:"";position:absolute;inset:0;border-radius:5px;background:var(--ink);animation:ring 1.6s ease-out infinite}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.8);opacity:0}}
.pulse.flash{animation:bump .6s var(--spring)}
@keyframes bump{0%{transform:scale(2.2)}100%{transform:scale(1)}}
#sweep{flex:1;height:2px;border-radius:1px;overflow:hidden;position:relative;background:linear-gradient(90deg,rgba(255,255,255,.14),rgba(255,255,255,.02))}
#sweep::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.8),transparent);transform:translateX(-100%)}
#sweep.go::after{animation:sweep .9s ease-out}
@keyframes sweep{0%{transform:translateX(-100%)}100%{transform:translateX(100%)}}

/* rack */
#rack{grid-row:3;grid-column:2;margin:8px 32px 12px 0;border-radius:26px;padding:18px;display:flex;flex-direction:column;gap:12px;min-height:0;position:relative;z-index:3;
  background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 30px 80px rgba(0,0,0,.7)}
.rhead{display:flex;align-items:center;gap:10px}
.rhead .t{font-size:17px;font-weight:800;flex:1}
.rhead .c{font-size:12px;font-weight:700}
.btn{border:0;cursor:pointer;font-weight:700;font-size:13px;border-radius:999px;height:36px;padding:0 16px;transition:transform .35s var(--spring),filter .2s}
.btn:hover{transform:scale(1.05)}
.btn:active{transform:scale(.93)}
.btn-w{background:var(--disc-on);color:#0a0a0a;box-shadow:0 6px 18px rgba(255,255,255,.10)}
.btn-d{background:linear-gradient(180deg,#3a3a3a,#0e0e0e);color:#f2f2f2;box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.rbtns{display:flex;gap:8px}
.rbtns .btn{flex:1}
#list{display:flex;flex-direction:column;gap:4px;overflow:auto;max-height:42%;min-height:60px;padding-right:2px}
.row{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 6px;border-radius:16px;transition:background .3s;animation:rowin .5s var(--spring) both}
@keyframes rowin{0%{opacity:0;transform:translateX(18px)}100%{opacity:1;transform:none}}
.row:hover{background:linear-gradient(90deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
.row.sel{background:linear-gradient(90deg,rgba(255,255,255,.15),rgba(255,255,255,.02));box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.row .pick{border:0;background:transparent;padding:0;cursor:pointer;display:flex;align-items:center;gap:10px;flex:1;min-width:0;text-align:left}
.ico{width:36px;height:36px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;background:var(--disc);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);transition:transform .4s var(--spring)}
.row:hover .ico{transform:rotate(-8deg) scale(1.06)}
.ico.err{background:var(--disc-on)}
.names{display:flex;flex-direction:column;gap:2px;min-width:0}
.names .n{font-size:14px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.names .p{font:500 11px/1.3 "JetBrains Mono",Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .btn{width:92px;flex:none}
.sep{height:1px;background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,255,255,.25),rgba(255,255,255,0))}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;background:linear-gradient(180deg,#0a0a0a,#1a1a1a);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.tab{flex:1;border:0;cursor:pointer;height:30px;border-radius:10px;background:transparent;font-size:12px;font-weight:700;transition:background .3s}
.tab span{background:var(--ink2);-webkit-background-clip:text;background-clip:text;color:transparent}
.tab.on{background:linear-gradient(180deg,#4a4a4a,#1c1c1c);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.tab.on span{background:var(--ink);-webkit-background-clip:text;background-clip:text}
#pane{flex:1;min-height:0;overflow:auto;border-radius:16px;padding:12px 14px;background:linear-gradient(180deg,#050505 0%,#161616 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);user-select:text}
.code{font:500 12px/1.65 "JetBrains Mono",Consolas,monospace;white-space:pre;margin:0;color:#bdbdbd}
.code .k{color:#fff;font-weight:700}
.code .s{color:#9e9e9e;font-style:italic}
.code .c{color:#5c5c5c}
.code .n{color:#e0e0e0}
.code .g{color:#ffffff;text-decoration:underline;text-decoration-color:rgba(255,255,255,.3)}
.tree{font:500 12px/1.4 Inter,sans-serif}
.tnode{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tnode:hover{background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0))}
.tnode.on{background:linear-gradient(90deg,rgba(255,255,255,.22),rgba(255,255,255,.02))}
.tnode .cls{font-size:11px;color:#7d7d7d}
.tnode .nm{color:#eee;font-weight:650}
.tnode .ev{font-size:10px;padding:1px 6px;border-radius:6px;background:linear-gradient(180deg,#fff,#9a9a9a);color:#000;font-weight:800}
.props{margin-top:10px;border-top:1px solid rgba(255,255,255,.1);padding-top:10px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;font:500 11.5px/1.4 "JetBrains Mono",monospace}
.props .k{color:#8a8a8a}
.props .v{color:#eee;overflow-wrap:anywhere}
.log{font:500 12px/1.5 "JetBrains Mono",Consolas,monospace;padding:6px 8px;border-radius:8px;margin-bottom:4px;white-space:pre-wrap;color:#cfcfcf;background:linear-gradient(90deg,rgba(255,255,255,.05),rgba(255,255,255,0))}
.log.warn{color:#fff;font-weight:700}
.log.error{background:linear-gradient(180deg,#fff,#a9a9a9);color:#000}
.log .u{opacity:.55;margin-right:6px}

/* bottom bar */
#bottom{grid-column:1/3;display:flex;align-items:center;justify-content:space-between;padding:0 32px;position:relative;z-index:4}
.bside{display:flex;gap:14px;align-items:flex-start;min-width:280px}
.bside.r{justify-content:flex-end;align-items:center}
#mcp{display:flex;align-items:center;gap:10px;height:40px;padding:0 16px;font-size:12px;font-weight:700}

/* popover + modal + toast */
#devmenu{position:absolute;bottom:96px;left:50%;transform:translateX(-50%) scale(.9);opacity:0;pointer-events:none;z-index:50;padding:8px;border-radius:20px;min-width:290px;
  background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 30px 80px rgba(0,0,0,.8);transition:all .35s var(--spring)}
#devmenu.open{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.dev{display:flex;align-items:center;justify-content:space-between;gap:16px;width:100%;border:0;background:transparent;cursor:pointer;padding:10px 12px;border-radius:12px;font-size:13px;font-weight:650}
.dev:hover{background:linear-gradient(90deg,rgba(255,255,255,.10),rgba(255,255,255,0))}
.dev.on{background:linear-gradient(180deg,#fff,#9c9c9c)}
.dev.on span{background:linear-gradient(180deg,#2a2a2a,#000);-webkit-background-clip:text;background-clip:text}
#modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.4),rgba(0,0,0,.8))}
#modal.open{display:flex}
.mcard{width:460px;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:16px;background:var(--panel);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 40px 120px rgba(0,0,0,.9);animation:pop .5s var(--spring) both}
.mcard h2{margin:0;font-size:22px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:12px;font-weight:700}
.field input{height:46px;border-radius:14px;border:0;padding:0 14px;font:600 15px Inter,sans-serif;color:#fff;outline:none;user-select:text;
  background:linear-gradient(180deg,#0a0a0a,#1c1c1c);box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
.field input:focus{box-shadow:inset 0 1px 3px rgba(0,0,0,.7),0 0 0 2px rgba(255,255,255,.6)}
.seg{display:flex;gap:4px;padding:4px;border-radius:14px;background:linear-gradient(180deg,#0a0a0a,#1a1a1a)}
.seg button{flex:1;height:40px;border:0;border-radius:10px;cursor:pointer;background:transparent;font-size:13px;font-weight:700}
.seg button span{background:var(--ink2);-webkit-background-clip:text;background-clip:text;color:transparent}
.seg button.on{background:var(--disc-on)}
.seg button.on span{background:linear-gradient(180deg,#2a2a2a,#000);-webkit-background-clip:text;background-clip:text}
.mbtns{display:flex;gap:8px;justify-content:flex-end}
#toast{position:fixed;left:50%;top:60px;transform:translate(-50%,-20px);opacity:0;z-index:200;padding:12px 18px;border-radius:14px;font-size:13px;font-weight:700;color:#000;
  background:linear-gradient(180deg,#fff,#a9a9a9);box-shadow:0 20px 60px rgba(0,0,0,.7);transition:all .45s var(--spring);pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:linear-gradient(180deg,#5a5a5a,#2a2a2a);border-radius:4px}::-webkit-scrollbar-track{background:transparent}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#8e8e8e"/></linearGradient>
    <linearGradient id="inkd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#000000"/></linearGradient>
  </defs>
</svg>

<div id="app">
  <div id="titlebar" data-drag>
    <div class="lights">
      <button class="light l1" id="wClose" aria-label="Fermer"><svg width="7" height="7" viewBox="0 0 10 10" stroke="#111" stroke-width="2.2" stroke-linecap="round"><path d="M2 2l6 6M8 2L2 8"/></svg></button>
      <button class="light l2" id="wMin" aria-label="Réduire"><svg width="7" height="7" viewBox="0 0 10 10" stroke="#fff" stroke-width="2.2" stroke-linecap="round"><path d="M2 5h6"/></svg></button>
      <button class="light l3" id="wMax" aria-label="Agrandir"><svg width="7" height="7" viewBox="0 0 10 10" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M2 8L8 2M4 2h4v4"/></svg></button>
    </div>
    <div id="title" data-drag><span class="gt" id="titleText">LuauUI Studio</span></div>
    <div class="meta" data-drag><span class="gt2">Rust · Luau · WebView2</span></div>
    <button id="langBtn" class="langbtn">FR</button>
  </div>

  <div id="toolbar" data-drag>
    <div class="tleft">
      <button class="ib" id="bOpen" title="Ouvrir un autre projet">
        <span class="disc"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="url(#ink)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg></span>
        <span class="lbl">Projet</span>
      </button>
      <button class="projname" id="bProj" title="Ouvrir le dossier du projet">
        <span class="t gt" id="projName">—</span>
        <span class="chev pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="url(#ink)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></span>
      </button>
    </div>

  if (focus) {

    if (inp) { inp.focus(); try { inp.setSelectionRange(focus.a, focus.b); } catch (_) {} }

  const empty = $("#emptyMsg");

function renderRack() {

function hl(code) {
  const KW = /^(local|function|end|if|then|else|elseif|for|in|do|while|repeat|until|return|break|continue|and|or|not|nil|true|false|type|export)$/;
  const GL = /^(game|script|workspace|Instance|UDim2|UDim|Vector2|Color3|ColorSequence|ColorSequenceKeypoint|NumberSequence|Enum|Font|task|require|print|warn|math|string|table|LuauUI|React|Roact)$/;
  let out = "", i = 0;
  while (i < code.length) {
    const r = code.slice(i);
    let m;
    if ((m = r.match(/^--\[(=*)\[[\s\S]*?\]\1\]/)) || (m = r.match(/^--[^\n]*/))) { out += `<span class="c">${esc(m[0])}</span>`; }
    else if ((m = r.match(/^\[(=*)\[[\s\S]*?\]\1\]/)) || (m = r.match(/^"(?:[^"\\\n]|\\.)*"?/)) || (m = r.match(/^'(?:[^'\\\n]|\\.)*'?/)) || (m = r.match(/^`(?:[^`\\]|\\.)*`?/))) { out += `<span class="s">${esc(m[0])}</span>`; }
    else if ((m = r.match(/^0x[0-9a-f_]+|^\d[\d_]*(\.\d+)?(e[+-]?\d+)?/i))) { out += `<span class="n">${esc(m[0])}</span>`; }
    else if ((m = r.match(/^[A-Za-z_][A-Za-z0-9_]*/))) { const w = m[0]; out += KW.test(w) ? `<span class="k">${w}</span>` : GL.test(w) ? `<span class="g">${w}</span>` : w; }
    else { m = [r[0]]; out += esc(r[0]); }
    i += m[0].length;
  }
  return out;
}

function fmtVal(v) {
  if (v == null) return "nil";
  if (typeof v !== "object") return typeof v === "string" ? JSON.stringify(v) : String(v);
  const n = x => +(+x).toFixed(3);
  switch (v.t) {
    case "UDim2": return `{${n(v.xs)}, ${n(v.xo)}}, {${n(v.ys)}, ${n(v.yo)}}`;
    case "UDim": return `{${n(v.s)}, ${n(v.o)}}`;
    case "V2": return `(${n(v.x)}, ${n(v.y)})`;
    case "C3": return `RGB(${Math.round(v.r*255)}, ${Math.round(v.g*255)}, ${Math.round(v.b*255)})`;
    case "E": return `Enum.${v.e}.${v.n}`;
    case "Font": return `${String(v.f || "").split("/").pop().replace(".json","")} ${v.w}`;
    case "CS": return `ColorSequence(${list(v.k).length})`;
    case "NS": return `NumberSequence(${list(v.k).length})`;
    default: return v.t || "{}";
  }
}

function findNode(roots, path) {
  const segs = path.split("/");
  const walk = (nodes, i) => {
    for (const n of nodes) {
      if (n.n === segs[i]) { if (i === segs.length - 1) return n; const f = walk(list(n.k), i + 1); if (f) return f; }
    }
    return null;
  };
  // layer paths start with the ScreenGui name
  return walk(roots, 0) || walk(roots.flatMap(r => list(r.k)), 1);
}

function renderPane() {
  const d = state.data; const pane = $("#pane");
  $$(".tab").forEach(t => t.classList.toggle("on", t.dataset.tab === state.tab));
  const errCount = d.logs ? d.logs.filter(l => l.kind === "error").length : 0;
  $("#logTab").textContent = d.logs && d.logs.length ? `${t("console")} · ${d.logs.length}` : t("console");
  if (state.tab === "code") {
    const key = "code:" + d.selected + ":" + (d.source || "").length + ":" + (d.source || "").slice(0, 64);
    if (pane.__key !== key) { pane.innerHTML = d.selected ? `<pre class="code">${hl(d.source || "")}</pre>` : `<span class="gt2">${t("noSelection")}</span>`; pane.__key = key; }
  } else if (state.tab === "tree") {

      rows.push(`<div class="tnode ${on ? "on" : ""}" style="padding-left:${6 + depth * 14}px;opacity:${isMod ? .6 : 1}" data-path="${esc(path)}"><span class="nm">${esc(n.n)}</span><span class="cls">${esc(n.c)}</span>${ev.length ? `<span class="ev">${ev.length} ${t("evt")}</span>` : ""}</div>`);
      list(n.k).forEach(c => walk(c, depth + 1, path + "/" + c.n));
    };
    roots.forEach(r => walk(r, 0, LAYER.has(r.c) ? r.n : d.selected));
    let props = "";
    if (state.inspected && state.inspected.ui === d.selected) {

      if (node) {

          Object.keys(pp).sort().map(k => `<span class="k">${esc(k)}</span><span class="v">${esc(fmtVal(pp[k]))}</span>`).join("") +
          (node.ev && !Array.isArray(node.ev) && Object.keys(node.ev).length ? `<span class="k">${t("events")}</span><span class="v">${esc(Object.keys(node.ev).join(", "))}</span>` : "") + "</div>";
      }

  } else {

    pane.innerHTML = logs.length

    pane.__key = null;
  }
}

// modal
let newKind = "component";
function openModal() { $("#modal").classList.add("open"); const i = $("#newName"); i.value = ""; setTimeout(() => i.focus(), 30); }

$("#bNew").onclick = openModal;
$("#mCancel").onclick = closeModal;
$$(".seg button").forEach(b => b.onclick = () => { newKind = b.dataset.kind; $$(".seg button").forEach(x => x.classList.toggle("on", x === b)); });
function createNew() {

document.addEventListener("keydown", e => {

  if (e.target.matches && e.target.matches("input,textarea")) return;
  if (e.ctrlKey && e.key.toLowerCase() === "r") { e.preventDefault(); post({ t: "reload" }); }
  if (e.ctrlKey && e.key.toLowerCase() === "n") { e.preventDefault(); openModal(); }
  if (!e.ctrlKey && e.key.toLowerCase() === "i") setInspect(!inspectMode);
  if (!e.ctrlKey && e.key.toLowerCase() === "s") setInspect(false);

document.addEventListener("contextmenu", e => { if (!e.target.closest("input,textarea,#pane")) e.preventDefault(); });

let toastT = 0;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 2600); }

// ---------------------------------------------------------------- API hooks (called from Rust)
const frames = (n) => new Promise(r => { const step = () => (--n <= 0 ? r() : requestAnimationFrame(step)); requestAnimationFrame(step); });

  const imgs = $$("img", screen).filter(i => !i.complete);
  if (imgs.length) await Promise.race([Promise.all(imgs.map(i => new Promise(r => { i.onload = i.onerror = r; }))), new Promise(r => setTimeout(r, 4000))]);
  postLayout($("#layers"));

  try {
    const anims = document.getAnimations().filter(a => { const tm = a.effect && a.effect.getTiming ? a.effect.getTiming() : {}; return tm.iterations !== Infinity; });
    if (anims.length) await Promise.race([Promise.all(anims.map(a => a.finished.catch(() => {}))), new Promise(r => setTimeout(r, 1500))]);

  receive,
  toast,
  async layout(id, name) {
    await settle();

    const nodes = $$(".rbx", screen).filter(el => !el.dataset.layer && (!name || el.dataset.ui === name)).map(el => {
      const r = el.getBoundingClientRect();
      const x = (r.left - sr.left) / s, y = (r.top - sr.top) / s, w = r.width / s, h = r.height / s;
      const cs = getComputedStyle(el);
      let hidden = false; for (let p = el; p && p !== screen; p = p.parentElement) if (getComputedStyle(p).display === "none") { hidden = true; break; }
      const tw = $(":scope > .rbx-c > .rbx-t", el), span = tw && tw.firstChild;
      const out = { ui: el.dataset.ui, path: el.dataset.path, class: el.dataset.cls, x: Math.round(x), y: Math.round(y), w: Math.round(w), h: Math.round(h), visible: !hidden && w > 0 && h > 0 };
      out.offscreen = x + w < 0 || y + h < 0 || x > d.device.w || y > d.device.h;
      out.clipped = x < -0.5 || y < -0.5 || x + w > d.device.w + 0.5 || y + h > d.device.h + 0.5;
      if (span && span.nodeType === 1 && span.tagName === "SPAN") {

  },
  async rect(id, scope) {

const phStyle = document.createElement("style");
